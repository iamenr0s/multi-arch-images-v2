name: Build and Push docker-debian-devel

on:
  push:
    branches:
      - main
    paths:
      - 'docker-debian-devel/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set short SHA tag
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64
        run: |
          podman build \
            --platform linux/amd64 \
            --manifest docker-debian-devel \
            -f docker-debian-devel/Dockerfile \
            docker-debian-devel/

      - name: Build arm64
        run: |
          podman build \
            --platform linux/arm64 \
            --manifest docker-debian-devel \
            -f docker-debian-devel/Dockerfile \
            docker-debian-devel/

      - name: Push to Quay.io
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all docker-debian-devel \
            quay.io/iamenr0s/docker-debian-devel:latest
          retry podman manifest push --all docker-debian-devel \
            "quay.io/iamenr0s/docker-debian-devel:${SHORT_SHA}"

      - name: Push to Docker Hub
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all docker-debian-devel \
            docker.io/iamenr0s/docker-debian-devel:latest
          retry podman manifest push --all docker-debian-devel \
            "docker.io/iamenr0s/docker-debian-devel:${SHORT_SHA}"
