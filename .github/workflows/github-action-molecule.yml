name: Build and Push github-action-molecule

on:
  push:
    branches:
      - main
    paths:
      - 'github-action-molecule/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set short SHA tag
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          podman build \
            --platform linux/amd64 \
            --manifest github-action-molecule \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            -f github-action-molecule/Dockerfile \
            github-action-molecule/

      - name: Build arm64
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          podman build \
            --platform linux/arm64 \
            --manifest github-action-molecule \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            -f github-action-molecule/Dockerfile \
            github-action-molecule/

      - name: Push to Quay.io
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all github-action-molecule \
            quay.io/iamenr0s/github-action-molecule:latest
          retry podman manifest push --all github-action-molecule \
            "quay.io/iamenr0s/github-action-molecule:${SHORT_SHA}"

      - name: Push to Docker Hub
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all github-action-molecule \
            docker.io/iamenr0s/github-action-molecule:latest
          retry podman manifest push --all github-action-molecule \
            "docker.io/iamenr0s/github-action-molecule:${SHORT_SHA}"
