name: Build and Push openvas-scanner

on:
  push:
    branches:
      - main
    paths:
      - 'openvas-scanner/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  IMAGE: openvas-scanner

jobs:
  prepare:
    name: Resolve upstream version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.upstream.outputs.version }}
      commit: ${{ steps.upstream.outputs.commit }}
      build_date: ${{ steps.upstream.outputs.build_date }}
      short_sha: ${{ steps.tags.outputs.short_sha }}
    steps:
      - name: Get upstream openvas-scanner version info
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/greenbone/openvas-scanner/releases/latest | jq -r '.tag_name // empty')
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "ERROR: Could not determine upstream openvas-scanner version" >&2
            exit 1
          fi
          TAG_OBJ=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/greenbone/openvas-scanner/git/ref/tags/${LATEST_TAG}")
          TAG_SHA=$(echo "${TAG_OBJ}" | jq -r '.object.sha')
          TAG_TYPE=$(echo "${TAG_OBJ}" | jq -r '.object.type')
          if [[ "${TAG_TYPE}" == "tag" ]]; then
            LATEST_COMMIT=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/greenbone/openvas-scanner/git/tags/${TAG_SHA}" \
              | jq -r '.object.sha' | cut -c1-7)
          else
            LATEST_COMMIT=$(echo "${TAG_SHA}" | cut -c1-7)
          fi
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${LATEST_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set short SHA tag
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.arch }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          podman build \
            --platform "linux/${{ matrix.arch }}" \
            -t "localhost/${IMAGE}:${{ matrix.arch }}" \
            --build-arg "IMAGE_VERSION=${VERSION}" \
            --build-arg "COMMIT=${COMMIT}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "OPENVAS_SCANNER_REF=${VERSION}" \
            --build-arg "BIN_VERSION=${VERSION}" \
            -f openvas-scanner/Dockerfile \
            openvas-scanner/

      # Each arch builds and pushes on its own runner (native arm64, no QEMU),
      # so the multi-arch manifest can only be assembled afterwards in the
      # publish job, from the digests captured here.
      - name: Push arch image and capture digests
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          mkdir -p digest-output
          podman push --digestfile=/tmp/quay-digest.txt \
            "localhost/${IMAGE}:${{ matrix.arch }}" \
            "quay.io/iamenr0s/${IMAGE}:${SHORT_SHA}-${{ matrix.arch }}"
          podman push --digestfile=/tmp/dockerhub-digest.txt \
            "localhost/${IMAGE}:${{ matrix.arch }}" \
            "docker.io/iamenr0s/${IMAGE}:${SHORT_SHA}-${{ matrix.arch }}"
          {
            echo "QUAY_DIGEST=$(cat /tmp/quay-digest.txt)"
            echo "DOCKERHUB_DIGEST=$(cat /tmp/dockerhub-digest.txt)"
          } > digest-output/digest.env

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: digest-output/digest.env
          retention-days: 1

  publish:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          path: digests

      - name: Build and push manifests
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          set -euo pipefail
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }

          source digests/digests-amd64/digest.env
          AMD64_QUAY_DIGEST="${QUAY_DIGEST}"
          AMD64_DOCKERHUB_DIGEST="${DOCKERHUB_DIGEST}"
          source digests/digests-arm64/digest.env
          ARM64_QUAY_DIGEST="${QUAY_DIGEST}"
          ARM64_DOCKERHUB_DIGEST="${DOCKERHUB_DIGEST}"

          podman manifest create "${IMAGE}-quay"
          podman manifest add "${IMAGE}-quay" "docker://quay.io/iamenr0s/${IMAGE}@${AMD64_QUAY_DIGEST}"
          podman manifest add "${IMAGE}-quay" "docker://quay.io/iamenr0s/${IMAGE}@${ARM64_QUAY_DIGEST}"
          retry podman manifest push --all "${IMAGE}-quay" "quay.io/iamenr0s/${IMAGE}:latest"
          retry podman manifest push --all "${IMAGE}-quay" "quay.io/iamenr0s/${IMAGE}:${SHORT_SHA}"

          podman manifest create "${IMAGE}-dockerhub"
          podman manifest add "${IMAGE}-dockerhub" "docker://docker.io/iamenr0s/${IMAGE}@${AMD64_DOCKERHUB_DIGEST}"
          podman manifest add "${IMAGE}-dockerhub" "docker://docker.io/iamenr0s/${IMAGE}@${ARM64_DOCKERHUB_DIGEST}"
          retry podman manifest push --all "${IMAGE}-dockerhub" "docker.io/iamenr0s/${IMAGE}:latest"
          retry podman manifest push --all "${IMAGE}-dockerhub" "docker.io/iamenr0s/${IMAGE}:${SHORT_SHA}"
