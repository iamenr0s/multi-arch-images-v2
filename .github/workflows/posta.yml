name: Build and Push posta

on:
  push:
    branches:
      - main
    paths:
      - 'posta/**'
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build multi-arch image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Get upstream posta version info
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/goposta/posta/releases/latest | jq -r '.tag_name // empty')
          if [[ -z "${LATEST_TAG}" ]]; then
            echo "ERROR: Could not determine upstream posta version" >&2
            exit 1
          fi
          TAG_OBJ=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/goposta/posta/git/ref/tags/${LATEST_TAG}")
          TAG_SHA=$(echo "${TAG_OBJ}" | jq -r '.object.sha')
          TAG_TYPE=$(echo "${TAG_OBJ}" | jq -r '.object.type')
          if [[ "${TAG_TYPE}" == "tag" ]]; then
            LATEST_COMMIT=$(curl -sf --retry 3 --retry-all-errors -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/goposta/posta/git/tags/${TAG_SHA}" \
              | jq -r '.object.sha' | cut -c1-7)
          else
            LATEST_COMMIT=$(echo "${TAG_SHA}" | cut -c1-7)
          fi
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "commit=${LATEST_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "build_date=${BUILD_DATE}" >> "$GITHUB_OUTPUT"

      - name: Set short SHA tag
        id: tags
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to Quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build amd64
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          BUILD_DATE: ${{ steps.upstream.outputs.build_date }}
        run: |
          podman build \
            --platform linux/amd64 \
            --manifest posta \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${COMMIT}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "POSTA_REF=${VERSION}" \
            -f posta/Dockerfile \
            posta/

      - name: Build arm64
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          BUILD_DATE: ${{ steps.upstream.outputs.build_date }}
        run: |
          podman build \
            --platform linux/arm64 \
            --manifest posta \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "COMMIT=${COMMIT}" \
            --build-arg "BUILD_DATE=${BUILD_DATE}" \
            --build-arg "POSTA_REF=${VERSION}" \
            -f posta/Dockerfile \
            posta/

      - name: Push to Quay.io
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all posta \
            quay.io/iamenr0s/posta:latest
          retry podman manifest push --all posta \
            "quay.io/iamenr0s/posta:${SHORT_SHA}"

      - name: Push to Docker Hub
        env:
          SHORT_SHA: ${{ steps.tags.outputs.short_sha }}
        run: |
          retry() { local i; for i in 1 2 3; do "$@" && return 0; [ "$i" -lt 3 ] && sleep $((15 * i)); done; return 1; }
          retry podman manifest push --all posta \
            docker.io/iamenr0s/posta:latest
          retry podman manifest push --all posta \
            "docker.io/iamenr0s/posta:${SHORT_SHA}"
